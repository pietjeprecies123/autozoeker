[project]
name = "autozoeker"
version = "0.1.0"
description = "Personal used-car search engine for the Dutch market"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "selectolax>=1.0",
    "apscheduler>=3.10,<4",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "anthropic>=2.0",
    "typer>=0.12",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
autozoeker = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: hits real external sites (skipped unless AUTOZOEKER_LIVE=1)"]
