# Canonical make/model/generation taxonomy for the Dutch used-car market.
#
# - `aliases` are matched case-insensitively against the raw make/model/title text
#   (word-boundary match; longest alias wins). Prefix an alias with `re:` for a regex.
# - `hints` let an alias imply a body type or fuel (e.g. "golf variant" → stationwagen).
# - Generation year ranges are by model year of first registration (best effort; transition
#   years overlap, so the newest generation whose `from` <= year wins unless a generation
#   keyword in the title says otherwise).
# - `segment`: A (city), B (small), C (compact), D (mid), E (large), SUV-B/C/D, MPV, SPORT, LUX.

makes:
  - slug: volkswagen
    name: Volkswagen
    aliases: [volkswagen, vw]
    models:
      - {slug: up, name: up!, aliases: ["up!", "up", "e-up", "e-up!"], segment: A, body: hatchback,
         generations: [{id: up-1, name: "up! (2011–2023)", from: 2011, to: 2023}]}
      - {slug: polo, name: Polo, aliases: [polo], segment: B, body: hatchback,
         generations: [{id: polo-6r, name: "Polo 6R/6C (2009–2017)", from: 2009, to: 2017, keywords: [6r, 6c]},
                       {id: polo-aw, name: "Polo AW (2017–heden)", from: 2018, to: null, keywords: [aw]}]}
      - {slug: golf, name: Golf, aliases: [golf, "golf variant", "golf sportsvan", "e-golf", "golf gte", "golf gti"], segment: C, body: hatchback,
         hints: {"golf variant": {body: stationwagen}, "e-golf": {fuel: elektrisch}, "golf gte": {fuel: plugin_hybride}},
         generations: [{id: golf-6, name: "Golf 6 (2008–2012)", from: 2008, to: 2012, keywords: ["golf 6", "golf vi", mk6]},
                       {id: golf-7, name: "Golf 7 (2012–2019)", from: 2013, to: 2019, keywords: ["golf 7", "golf vii", mk7, "7.5"]},
                       {id: golf-8, name: "Golf 8 (2019–heden)", from: 2020, to: null, keywords: ["golf 8", "golf viii", mk8]}]}
      - {slug: t-roc, name: T-Roc, aliases: [t-roc, troc, "t roc"], segment: SUV-C, body: suv,
         generations: [{id: t-roc-1, name: "T-Roc (2017–heden)", from: 2017, to: null}]}
      - {slug: t-cross, name: T-Cross, aliases: [t-cross, tcross, "t cross"], segment: SUV-B, body: suv,
         generations: [{id: t-cross-1, name: "T-Cross (2019–heden)", from: 2019, to: null}]}
      - {slug: taigo, name: Taigo, aliases: [taigo], segment: SUV-B, body: suv,
         generations: [{id: taigo-1, name: "Taigo (2021–heden)", from: 2021, to: null}]}
      - {slug: tiguan, name: Tiguan, aliases: [tiguan, "tiguan allspace"], segment: SUV-C, body: suv,
         generations: [{id: tiguan-2, name: "Tiguan II (2016–2023)", from: 2016, to: 2023},
                       {id: tiguan-3, name: "Tiguan III (2024–heden)", from: 2024, to: null}]}
      - {slug: touran, name: Touran, aliases: [touran], segment: MPV, body: mpv,
         generations: [{id: touran-2, name: "Touran II (2015–2024)", from: 2015, to: 2024}]}
      - {slug: passat, name: Passat, aliases: [passat, "passat variant", "passat gte"], segment: D, body: stationwagen,
         hints: {"passat gte": {fuel: plugin_hybride}},
         generations: [{id: passat-b8, name: "Passat B8 (2014–2023)", from: 2015, to: 2023, keywords: [b8]},
                       {id: passat-b9, name: "Passat B9 (2024–heden)", from: 2024, to: null, keywords: [b9]}]}
      - {slug: arteon, name: Arteon, aliases: [arteon], segment: D, body: sedan,
         generations: [{id: arteon-1, name: "Arteon (2017–2024)", from: 2017, to: 2024}]}
      - {slug: id-3, name: ID.3, aliases: ["id.3", "id3", "id 3"], segment: C, body: hatchback, fuel: elektrisch,
         generations: [{id: id-3-1, name: "ID.3 (2020–heden)", from: 2020, to: null}]}
      - {slug: id-4, name: ID.4, aliases: ["id.4", "id4", "id 4"], segment: SUV-C, body: suv, fuel: elektrisch,
         generations: [{id: id-4-1, name: "ID.4 (2021–heden)", from: 2021, to: null}]}
      - {slug: id-5, name: ID.5, aliases: ["id.5", "id5", "id 5"], segment: SUV-C, body: suv, fuel: elektrisch,
