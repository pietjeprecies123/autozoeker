id: vag-tsi-engines
title: TSI-benzinemotoren EA211 (1.0/1.2/1.4/1.5 TSI) – Volkswagen-groep
summary: >-
  De EA211-generatie TSI-motoren (vanaf ca. 2012) is in het algemeen solide. Twee bekende aandachtspunten:
  de kunststof waterpomp/thermostaatbehuizing kan gaan lekken, en de 1.5 TSI 'evo' (vanaf 2017) kon bij een
  koude motor schokkerig/haperend rijden ('kangoeroeën'), waarvoor Volkswagen een software-update uitbracht.
applies_to:
  - {make: volkswagen, model: polo}
  - {make: volkswagen, model: golf}
  - {make: volkswagen, model: t-roc}
  - {make: volkswagen, model: t-cross}
  - {make: volkswagen, model: tiguan}
  - {make: volkswagen, model: touran}
  - {make: volkswagen, model: passat}
  - {make: volkswagen, model: arteon}
  - {make: skoda, model: fabia}
  - {make: skoda, model: octavia}
  - {make: skoda, model: scala}
  - {make: skoda, model: kamiq}
  - {make: skoda, model: karoq}
  - {make: skoda, model: kodiaq}
  - {make: skoda, model: superb}
  - {make: seat, model: ibiza}
  - {make: seat, model: leon}
  - {make: seat, model: arona}
